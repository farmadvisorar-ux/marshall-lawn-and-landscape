<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="gradEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="50%" stop-color="#16a34a"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
    <linearGradient id="gradGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#15803d" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background Rounded Badge -->
  <rect width="64" height="64" rx="16" fill="#0b1310"/>
  <rect x="2" y="2" width="60" height="60" rx="14" fill="none" stroke="url(#gradEmerald)" stroke-width="2"/>

  <!-- Emerald Lawn Leaf Emblem -->
  <g filter="url(#glow)">
    <path d="M32 10 C20 18 14 30 18 44 C22 48 30 52 38 50 C48 48 52 36 50 24 C44 14 36 10 32 10 Z" fill="url(#gradEmerald)"/>
    <!-- Leaf Center Rib -->
    <path d="M32 10 Q32 30 38 50" fill="none" stroke="#86efac" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Blade Stripes -->
    <path d="M26 24 Q32 28 35 27" fill="none" stroke="#86efac" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M24 34 Q32 37 37 36" fill="none" stroke="#86efac" stroke-width="1.8" stroke-linecap="round"/>
  </g>

  <!-- 5-Star Gold Crest Accent -->
  <polygon points="46,14 48,19 53,19 49,22 51,27 46,24 41,27 43,22 39,19 44,19" fill="url(#gradGold)"/>
</svg>
